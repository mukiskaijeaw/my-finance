<div id="shopping-response-__KIND__">
  <style>
    [id="shopping-response-__KIND__"]{color-scheme:light dark;--response-bg:light-dark(#fff,#202329);--response-text:light-dark(#272b30,#f1f3f5);--response-muted:light-dark(#6e757c,#b6bdc5);--response-line:light-dark(#e8ecef,#3b424b);--response-accent:light-dark(#00856a,#64d6b3);font-family:Tahoma,"Leelawadee UI",system-ui,sans-serif;color:var(--response-text);width:100%}
    [id="shopping-response-__KIND__"] *{box-sizing:border-box}
    [id="shopping-response-__KIND__"] section{padding:22px;border:1px solid var(--response-line);border-radius:18px;background:var(--response-bg)}
    [id="shopping-response-__KIND__"] .eyebrow{font-size:12px;color:var(--response-muted);margin:0 90px 14px 0;line-height:1.8}
    [id="shopping-response-__KIND__"] h2{font-size:23px;line-height:1.5;margin:0 0 8px}
    [id="shopping-response-__KIND__"] .status{font-size:13px;color:var(--response-muted);line-height:1.8}
    [id="shopping-response-__KIND__"] .hero{font-size:38px;font-weight:700;color:var(--response-accent);margin:10px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
    [id="shopping-response-__KIND__"] .label{font-size:12px;line-height:1.8;color:var(--response-muted)}
    [id="shopping-response-__KIND__"] hr{border:0;border-top:1px solid var(--response-line);margin:20px 0}
    [id="shopping-response-__KIND__"] .metrics{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    [id="shopping-response-__KIND__"] .value{font-size:28px;font-weight:700;line-height:1.5;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
    [id="shopping-response-__KIND__"] dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;font-size:13px;line-height:1.8;margin:0}
    [id="shopping-response-__KIND__"] dt{color:var(--response-muted)}
    [id="shopping-response-__KIND__"] dd{margin:0;text-align:right;overflow-wrap:anywhere}
    [id="shopping-response-__KIND__"] .recommendation{font-size:14px;line-height:1.9;margin:0}
    [id="shopping-response-__KIND__"] .note{font-size:12px;line-height:1.9;margin:12px 0 0;color:var(--response-muted)}
    @media(max-width:430px){[id="shopping-response-__KIND__"] section{padding:16px}[id="shopping-response-__KIND__"] .metrics{grid-template-columns:1fr}[id="shopping-response-__KIND__"] dl{grid-template-columns:1fr}[id="shopping-response-__KIND__"] dd{text-align:left}}
  </style>
  <section aria-label="__TITLE__">
    <div class="eyebrow">SHOPPING AGENT · __MODE__</div>
    <h2>__TITLE__</h2><div class="status">__STATUS__</div>
    <div class="label">__HERO_LABEL__</div><div class="hero">__HERO__</div>
    <hr>
    <div class="metrics"><div><div class="label">__METRIC_1_LABEL__</div><div class="value">__METRIC_1__</div></div><div><div class="label">__METRIC_2_LABEL__</div><div class="value">__METRIC_2__</div></div></div>
    <hr>
    <dl><dt>__ROW_1_LABEL__</dt><dd>__ROW_1__</dd><dt>__ROW_2_LABEL__</dt><dd>__ROW_2__</dd><dt>__ROW_3_LABEL__</dt><dd>__ROW_3__</dd><dt>__ROW_4_LABEL__</dt><dd>__ROW_4__</dd></dl>
    <hr>
    <p class="recommendation">__RECOMMENDATION__</p>
    <p class="note">__LIMITATIONS__</p>
  </section>
</div>
