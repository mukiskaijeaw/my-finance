<div id="shopping-welcome">
  <style>
    #shopping-welcome{color-scheme:light dark;--welcome-bg:light-dark(#fff,#202329);--welcome-text:light-dark(#27292b,#f0f2f4);--welcome-muted:light-dark(#777b80,#b1b7bf);--welcome-border:light-dark(#eceef0,#3c4148);font-family:Tahoma,"Leelawadee UI",system-ui,sans-serif;color:var(--welcome-text);width:100%}
    #shopping-welcome *{box-sizing:border-box}
    #shopping-welcome .welcome-surface{background:var(--welcome-bg);border:1px solid var(--welcome-border);border-radius:20px;padding:22px 16px 16px}
    #shopping-welcome header{text-align:center;margin:0 80px 20px}
    #shopping-welcome .welcome-mark{display:flex;justify-content:center;margin-bottom:12px}
    #shopping-welcome .welcome-mark svg{width:30px;height:30px}
    #shopping-welcome h2{font-size:24px;line-height:1.5;margin:0;font-weight:700}
    #shopping-welcome header p{font-size:12px;line-height:1.8;color:var(--welcome-muted);margin:6px 0 0}
    #shopping-welcome .welcome-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    #shopping-welcome .welcome-wide{grid-column:1/-1}
    #shopping-welcome button{appearance:none;text-align:left;display:flex;flex-direction:column;gap:7px;min-width:0;padding:14px;border:1px solid var(--welcome-border);border-radius:17px;background:var(--welcome-bg);color:var(--welcome-text);font:inherit;min-height:100px}
    #shopping-welcome button:hover,#shopping-welcome button[aria-pressed="true"]{background:light-dark(#f5f8f7,#2b3533);border-color:light-dark(#b2cac1,#627e73)}
    #shopping-welcome button:disabled{opacity:.65}
    #shopping-welcome button strong{font-size:14px;line-height:1.6}
    #shopping-welcome button span{font-size:12px;line-height:1.7;color:var(--welcome-muted)}
    #shopping-welcome button svg{width:20px;height:20px}
    #shopping-welcome .welcome-feedback{font-size:12px;color:var(--welcome-muted);line-height:1.8;margin:10px 0 0}
    #shopping-welcome .welcome-feedback:empty{display:none}
    @media(max-width:500px){#shopping-welcome header{margin:0 0 18px;padding-top:26px}#shopping-welcome h2{font-size:21px}#shopping-welcome .welcome-grid{grid-template-columns:1fr}}
  </style>
  <section class="welcome-surface" aria-label="Shopping Agent เริ่มต้น">
    <header><div class="welcome-mark"><i data-lucide="wallet" aria-hidden="true"></i></div><h2>วันนี้อยากปรึกษาเรื่องเงินอะไร?</h2><p>ผู้ช่วยทางการเงินที่เข้าใจแผนการใช้เงินของคุณ</p></header>
    <div class="welcome-grid">
      <button type="button" class="cursor-interaction" data-prompt="วันนี้ยังใช้เงินได้อีกเท่าไหร่" aria-pressed="false"><i data-lucide="wallet" aria-hidden="true"></i><strong>เช็กเงินคงเหลือ</strong><span>วันนี้ยังใช้เงินได้อีกเท่าไหร่</span></button>
      <button type="button" class="cursor-interaction" data-prompt="อยากซื้อของชิ้นหนึ่ง ควรซื้อไหม" aria-pressed="false"><i data-lucide="shopping-bag" aria-hidden="true"></i><strong>ตัดสินใจซื้อของ</strong><span>อยากซื้อของชิ้นหนึ่ง ควรซื้อไหม</span></button>
      <button type="button" class="cursor-interaction" data-prompt="วางแผนและติดตามสิ่งที่อยากได้" aria-pressed="false"><i data-lucide="target" aria-hidden="true"></i><strong>เป้าหมายของฉัน</strong><span>วางแผนและติดตามสิ่งที่อยากได้</span></button>
      <button type="button" class="cursor-interaction" data-prompt="เงินหายไปกับอะไรโดยไม่รู้ตัว" aria-pressed="false"><i data-lucide="scan-search" aria-hidden="true"></i><strong>จับโป๊ะรายจ่าย</strong><span>เงินหายไปกับอะไรโดยไม่รู้ตัว</span></button>
      <button type="button" class="cursor-interaction welcome-wide" data-prompt="อยากไปเที่ยวที่ไหน ต้องเตรียมเงินเท่าไหร่" aria-pressed="false"><i data-lucide="plane" aria-hidden="true"></i><strong>วางแผนเที่ยว</strong><span>อยากไปเที่ยวที่ไหน ต้องเตรียมเงินเท่าไหร่</span></button>
    </div>
    <p class="welcome-feedback" role="status" aria-live="polite"></p>
  </section>
  <script>
    (()=>{
      const root=document.getElementById('shopping-welcome');
      const buttons=[...root.querySelectorAll('button[data-prompt]')];
      const feedback=root.querySelector('.welcome-feedback');
      let busy=false;
      function restore(saved){const selected=saved?.modelContent?.welcomeChoice;buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.prompt===selected)));}
      restore(window.openai?.widgetState);
      window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
      buttons.forEach(button=>button.addEventListener('click',async()=>{
        if(busy)return;
        const host=window.openai;
        if(typeof host?.sendFollowUpMessage!=='function'){feedback.textContent='ส่งจากปุ่มไม่ได้ในเวอร์ชันนี้ พิมพ์หัวข้อ: '+button.dataset.prompt;return;}
        busy=true;buttons.forEach(item=>item.disabled=true);feedback.textContent='กำลังส่งหัวข้อที่เลือก…';
        try{
          await host.sendFollowUpMessage({prompt:button.dataset.prompt,title:button.querySelector('strong').textContent});
          restore({modelContent:{welcomeChoice:button.dataset.prompt}});
          if(host.setWidgetState)host.setWidgetState({modelContent:{welcomeChoice:button.dataset.prompt},privateContent:null}).catch(()=>{});
          feedback.textContent='ส่งหัวข้อที่เลือกแล้ว';
        }catch(error){feedback.textContent='ยังส่งไม่สำเร็จ ลองกดอีกครั้ง หรือพิมพ์: '+button.dataset.prompt;}
        finally{busy=false;buttons.forEach(item=>item.disabled=false);}
      }));
    })();
  </script>
</div>
